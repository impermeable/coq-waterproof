name: Build

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up git repository
        uses: actions/checkout@v3

      - name: Build plugin
        uses: rocq-prover/docker-opam-action@v1
        with:
          custom_image: 'rocq/rocq-prover:9.0-ocaml-4.14-flambda'
          opam_file: 'rocq-waterproof.opam'
          before_script: |
            startGroup "Install dependencies"
              sudo apt-get -y -q install binutils make csh g++ sed gawk autoconf automake autotools-dev
            endGroup
            startGroup "Print opam config and unpin Dune"
              opam config list; opam repo list; opam list
              opam unpin dune -n || true
            endGroup
